name: Build WOL Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go server for MIPS
        run: |
          cd src
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=0 go build -o server server.go

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: src/server

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: wol-plugin
          path: |
            src/server
            src/index.html
            src/start_script
            src/xiaomi.project
